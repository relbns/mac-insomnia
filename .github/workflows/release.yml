name: Build and Release

on:
  push:
    tags:
      - 'v*.*.*' # triggers on version tags like v1.0.2

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Test
        run: npm test

      - name: Build app
        run: npm run build

      - name: Write release notes
        run: |
          node scripts/release-notes.js "$GITHUB_REF_NAME" > release-notes.md
          gh release edit "$GITHUB_REF_NAME" --notes-file release-notes.md
