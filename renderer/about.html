<!DOCTYPE html>
<html>

<head>
    <title>About - Mac Insomnia</title>
    <style>
        body {
            margin: 0;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
            height: 100vh;
            background: #1e1e1e;
            color: #fff;
            display: grid;
            /* 1fr (top spacer) | content | footer | 1fr (bottom spacer) */
            grid-template-rows: 1fr auto auto 1fr;
            place-items: center;
            /* centers horizontally */
            text-align: center;
            overflow: hidden;
        }

        main {
            grid-row: 2;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
        }

        footer {
            grid-row: 3;
            font-size: 14px;
            color: #808080;
            padding-bottom: 12px;
            /* small breathing room above window edge */
        }

        h2 {
            margin: 0;
            font-weight: 700;
        }

        #version {
            margin: 4px 0 0;
            color: #a0a0a0;
        }

        img {
            width: 128px;
            height: 128px;
            margin-top: 10px;
        }

        .link {
            color: #4da3ff;
            text-decoration: none;
            font-weight: 500;
            transition: color 0.3s ease, text-shadow 0.3s ease;
        }

        .link:hover {
            color: #82caff;
            text-shadow: 0 0 6px #4da3ff;
        }

        .signature {
            margin-top: 4px;
            color: #666;
            font-size: 13px;
            letter-spacing: 0.3px;
            transition: color 0.3s ease, text-shadow 0.3s ease;
        }

        .signature:hover {
            color: #9b9b9b;
            text-shadow: 0 0 4px #4da3ff;
        }
    </style>
</head>

<body>
    <main>
        <h2>Mac Insomnia</h2>
        <p id="version">Version</p>
        <img src="../assets/insomnia-logo.png" alt="Mac Insomnia">
    </main>

    <footer>
        <p>
            <a href="https://github.com/relbns/mac-insomnia" target="_blank" class="link">
                View on GitHub
            </a>
        </p>
        <p class="signature">© Ariel Benesh (relbns)</p>
    </footer>

    <script>
        window.insomnia.getVersion().then((version) => {
            document.getElementById('version').textContent = `Version ${version}`;
        });
    </script>
</body>


</html>
