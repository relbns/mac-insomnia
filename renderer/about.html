<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; img-src 'self' file:; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
    <title>About Mac Insomnia</title>
    <style>
        :root {
            --text: rgba(0, 0, 0, 0.85);
            --secondary: rgba(0, 0, 0, 0.5);
            --button: rgba(0, 0, 0, 0.06);
            --button-hover: rgba(0, 0, 0, 0.1);
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --text: rgba(255, 255, 255, 0.88);
                --secondary: rgba(255, 255, 255, 0.5);
                --button: rgba(255, 255, 255, 0.1);
                --button-hover: rgba(255, 255, 255, 0.16);
            }
        }

        html,
        body {
            height: 100%;
            margin: 0;
            background: transparent;
            color: var(--text);
            font: 13px/1.4 -apple-system, BlinkMacSystemFont, sans-serif;
            -webkit-font-smoothing: antialiased;
            -webkit-user-select: none;
            user-select: none;
            cursor: default;
        }

        body {
            -webkit-app-region: drag;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 4px;
            padding: 20px 28px 22px;
            box-sizing: border-box;
            text-align: center;
        }

        img {
            width: 104px;
            height: 104px;
            margin-bottom: 8px;
            filter: drop-shadow(0 6px 14px rgba(0, 0, 0, 0.18));
        }

        h1 {
            margin: 0;
            font-size: 20px;
            font-weight: 600;
            letter-spacing: -0.015em;
        }

        .version {
            color: var(--secondary);
            font-variant-numeric: tabular-nums;
        }

        .tagline {
            margin: 10px 0 16px;
            max-width: 220px;
            color: var(--secondary);
        }

        nav {
            -webkit-app-region: no-drag;
            display: flex;
            gap: 8px;
        }

        nav a {
            padding: 5px 14px;
            border-radius: 7px;
            background: var(--button);
            color: var(--text);
            text-decoration: none;
            font-weight: 500;
            transition: background 0.15s ease;
        }

        nav a:hover {
            background: var(--button-hover);
        }

        footer {
            margin-top: 18px;
            font-size: 11px;
            color: var(--secondary);
        }
    </style>
</head>

<body>
    <img src="../assets/insomnia-logo.png" alt="">
    <h1>Mac Insomnia</h1>
    <div class="version" id="version">&nbsp;</div>
    <p class="tagline">Keeps your Mac awake when you need it, and gets out of the way.</p>
    <nav>
        <a href="https://github.com/relbns/mac-insomnia" target="_blank">GitHub</a>
        <a href="https://github.com/relbns/mac-insomnia/releases" target="_blank">Releases</a>
    </nav>
    <footer>© 2024 Ariel Benesh · MIT License</footer>

    <script>
        window.insomnia.getVersion().then((version) => {
            document.getElementById('version').textContent = `Version ${version}`;
        });
    </script>
</body>

</html>
