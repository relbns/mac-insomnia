<!DOCTYPE html>
<html>

<head>
    <title>Settings - Mac Insomnia</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
            margin: 16px;
            background-color: #1e1e1e;
            color: #ffffff;
            overflow: hidden;
        }

        .setting-group {
            margin-bottom: 16px;
            padding: 12px;
            background-color: #2d2d2d;
            border-radius: 8px;
        }

        .setting-group h3 {
            margin-top: 0;
            margin-bottom: 8px;
            color: #ffffff;
            font-size: 16px;
        }

        .radio-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .checkbox-group {
            margin: 6px 0;
        }

        button {
            width: 100%;
            background-color: #0066cc;
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            margin-top: 8px;
        }

        button:hover {
            background-color: #0052a3;
        }

        label {
            display: flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
            font-size: 14px;
        }

        .disabled-note {
            color: #888;
            font-size: 12px;
            margin-top: 4px;
            margin-left: 24px;
        }
    </style>
</head>

<body>
    <div class="setting-group">
        <h3>Default Duration</h3>
        <div class="radio-group" id="defaultDuration">
            <label><input type="radio" name="defaultDuration" value="null"> Infinite</label>
            <label><input type="radio" name="defaultDuration" value="1800000"> 30 minutes</label>
            <label><input type="radio" name="defaultDuration" value="3600000"> 1 hour</label>
            <label><input type="radio" name="defaultDuration" value="7200000"> 2 hours</label>
        </div>
    </div>

    <div class="setting-group">
        <h3>Icon Set</h3>
        <div class="radio-group" id="iconSet">
            <label><input type="radio" name="iconSet" value="set1"> Set 1 (Default)</label>
            <label><input type="radio" name="iconSet" value="set2"> Set 2</label>
        </div>
    </div>

    <div class="setting-group">
        <div class="checkbox-group">
            <label><input type="checkbox" id="soundEnabled"> Enable Sound Effects</label>
        </div>
        <div class="checkbox-group">
            <label><input type="checkbox" id="startAtLogin"> Start at Login</label>
            <div class="disabled-note" id="devNote" hidden>Start at login is disabled in development mode</div>
        </div>
    </div>

    <button id="saveButton">Save Settings</button>

    <script>
        window.insomnia.getSettings().then((settings) => {
            const duration = settings.defaultDuration === null ? 'null' : String(settings.defaultDuration);
            const durationInput = document.querySelector(`input[name="defaultDuration"][value="${duration}"]`);
            if (durationInput) durationInput.checked = true;
            document.querySelector(`input[name="iconSet"][value="${settings.iconSet}"]`).checked = true;
            document.getElementById('soundEnabled').checked = settings.soundEnabled;

            const startAtLogin = document.getElementById('startAtLogin');
            startAtLogin.checked = settings.startAtLogin;
            if (settings.isDevelopment) {
                startAtLogin.disabled = true;
                document.getElementById('devNote').hidden = false;
            }
        });

        document.getElementById('saveButton').addEventListener('click', () => {
            window.insomnia.saveSettings({
                defaultDuration: document.querySelector('input[name="defaultDuration"]:checked').value,
                iconSet: document.querySelector('input[name="iconSet"]:checked').value,
                soundEnabled: document.getElementById('soundEnabled').checked,
                startAtLogin: document.getElementById('startAtLogin').checked
            });
            window.close();
        });
    </script>
</body>

</html>
